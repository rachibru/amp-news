  <!-- Script di Reindirizzamento Istantaneo senza blocchi CORS -->
  <script>
    (function() {
      var feedUrl = 'https://www.brunorachiele.it/feeds/posts/summary/-/%22Rassegna%20Stampa%22?alt=json&max-results=1';
      fetch(feedUrl)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.feed && data.feed.entry && data.feed.entry.length > 0) {
            var latestPost = data.feed.entry[0];
            var alternateLink = latestPost.link.find(function(l) { return l.rel === 'alternate'; });
            if (alternateLink && alternateLink.href) {
              window.location.replace(alternateLink.href);
            }
          }
        })
        .catch(function(err) {
          console.error(err);
        });
    })();
  </script>
