  <!-- Script Integrato per Data Dinamica e Importazione Contenuto Ultima Rassegna senza Redirect -->
  <script>
    (function() {
      // 1. Formattazione e aggiornamento della data odierna
      var today = new Date();
      var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      var formattedDate = today.toLocaleDateString('it-IT', options);
      formattedDate = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
      
      var badgeElem = document.getElementById('current-date-badge');
      if (badgeElem) {
        badgeElem.innerText = formattedDate;
      }

      // 2. Recupero dinamico dell'ultimo articolo da Blogger senza redirect
      var feedUrl = 'https://www.brunorachiele.it/feeds/posts/default/-/%22Rassegna%20Stampa%22?alt=json&max-results=1';
      fetch(feedUrl)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.feed && data.feed.entry && data.feed.entry.length > 0) {
            var entry = data.feed.entry[0];
            var title = entry.title.$t;
            var content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : '');
            
            var container = document.getElementById('latest-post-content');
            if (container) {
              container.innerHTML = '<h2 style="color:#1a365d; margin-top:0;">' + title + '</h2>' + content;
            }
          }
        })
        .catch(function(err) {
          console.error('Errore nel recupero del feed:', err);
        });
    })();
  </script>
