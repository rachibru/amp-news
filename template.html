<!doctype html>
<html ⚡ lang="it">
<head>
  <meta charset="utf-8">
  <script async src="https://cdn.ampproject.org/v0.js"></script>
  <title>{{ TITLE }}</title>
  <link rel="canonical" href="{{ CANONICAL_URL }}">
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
  
  <!-- Schema Dati per Google News -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": "{{ TITLE }}",
    "mainEntityOfPage": "{{ CANONICAL_URL }}",
    "datePublished": "{{ DATE }}",
    "author": {
      "@type": "Person",
      "name": "Bruno Rachiele"
    }
  }
  </script>

  <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
  <style amp-custom>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; background: #f4f4f7; color: #222; }
    .card { max-width: 680px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h1 { font-size: 22px; line-height: 1.35; color: #111; margin-bottom: 15px; }
    amp-img { margin-bottom: 15px; max-width: 100%; border-radius: 4px; }
    footer { text-align: center; margin-top: 25px; font-size: 13px; color: #666; }
    footer a { color: #0056b3; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>{{ TITLE }}</h1>
    </header>
    <main>
      {{ CONTENT }}
    </main>
    <footer>
      <p><a href="{{ CANONICAL_URL }}">Leggi la notizia completa su BrunoRachiele.it</a></p>
    </footer>
  </div>
</body>
</html>
