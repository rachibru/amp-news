<!doctype html>
<html ⚡ lang="it">
<head>
  <meta charset="utf-8">
  <script async src="https://cdn.ampproject.org/v0.js"></script>
  <!-- Componente AdSense per AMP -->
  <script async custom-element="amp-ad" src="https://cdn.ampproject.org/v0/amp-ad-0.1.js"></script>
  <title>{{ TITLE }}</title>
  <link rel="canonical" href="{{ CANONICAL_URL }}">
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
  
  <!-- Schema Dati per Google News -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": "{{ TITLE }}",
    "mainEntityOfPage": "{{ CANONICAL_URL }}",
    "datePublished": "{{ DATE }}",
    "author": {
      "@type": "Person",
      "name": "Bruno Rachiele"
    },
    "publisher": {
      "@type": "Organization",
      "name": "BRUNORACHIELE.IT",
      "logo": {
        "@type": "ImageObject",
        "url": "https://static.brunorachiele.it/logoorizzontalebianco.png"
      }
    }
  }
  </script>

  <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
  <style amp-custom>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: #f4f4f7; color: #222; }
    
    /* Header pulito con logo originale */
    .site-header { background: #ffffff; text-align: center; padding: 15px 0; border-bottom: 1px solid #eaeaea; }
    .site-header a { display: inline-block; }
    .site-header amp-img { margin: 0 auto; display: block; }
    
    .card { max-width: 680px; margin: 20px auto 30px auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h1 { font-size: 22px; line-height: 1.35; color: #111; margin-bottom: 15px; }
    amp-img { margin-bottom: 15px; max-width: 100%; border-radius: 4px; }
    
    /* Blocco pubblicitario AMP */
    .ad-container { margin: 20px 0; text-align: center; }
    
    footer { text-align: center; margin-top: 25px; font-size: 13px; color: #666; }
    footer a { color: #0056b3; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="https://www.brunorachiele.it">
      <amp-img src="https://static.brunorachiele.it/logoorizzontalebianco.png" width="220" height="45" layout="fixed" alt="BRUNORACHIELE.IT"></amp-img>
    </a>
  </header>

  <div class="card">
    <main>
      <h1>{{ TITLE }}</h1>
      
      <!-- PUBBLICITÀ ADSENSE (Prima del contenuto) -->
      <div class="ad-container">
<amp-ad width="300" height="250"
    type="adsense"
    data-ad-client="ca-pub-9225028785900171"
    data-ad-slot="3435201094"
    data-auto-format="mngs"
    data-full-width="">
  <div overflow=""></div>
</amp-ad>

      {{ CONTENT }}

      <!-- PUBBLICITÀ ADSENSE (Fine articolo) -->
      <div class="ad-container">
       <amp-ad width="300" height="250"
    type="adsense"
    data-ad-client="ca-pub-9225028785900171"
    data-ad-slot="3435201094"
    data-auto-format="mngs"
    data-full-width="">
  <div overflow=""></div>
</amp-ad>

    <footer>
      <p><a href="{{ CANONICAL_URL }}">Leggi la notizia completa su BrunoRachiele.it</a></p>
    </footer>
  </div>
</body>
</html>
