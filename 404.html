           (adsbygoogle = window.adsbygoogle || []).push({});

    <div class="posts-title">📰 Ultimi articoli dal blog:</div>
    
    <div id="latest-posts">
      <p style="color: #64748b; font-size: 0.9rem;">Caricamento ultimi articoli...</p>
    </div>

    <!-- Banner AdSense Inferiore -->
    <div class="ad-box">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9225028785900171"
           data-ad-slot="1234567890"

      </script>
    </div>
  </main>

  <!-- Script XML Feed / Sitemap Parser per azzerare errori CORS -->
  <script>
    (function() {
      // Estrae direttamente gli articoli dall'RSS di Blogger
      var feedUrl = 'https://www.brunorachiele.it/feeds/posts/default?alt=rss';

      fetch(feedUrl)
        .then(function(response) { return response.text(); })
        .then(function(str) {
          var parser = new DOMParser();
          var xmlDoc = parser.parseFromString(str, "text/xml");
          var items = xmlDoc.getElementsByTagName("item");
          var container = document.getElementById('latest-posts');
          
          if (items && items.length > 0) {
            var html = '';
            var count = Math.min(items.length, 5); // Prende gli ultimi 5 articoli
            
            for (var i = 0; i < count; i++) {
              var title = items[i].getElementsByTagName("title")[0].textContent;
              var link = items[i].getElementsByTagName("link")[0].textContent;
              
              html += '<div class="post-item"><a href="' + link + '">' + title + '</a></div>';
              
              // Inserisce pubblicità in-feed dopo il secondo articolo
              if (i === 1) {
                html += '<div class="ad-box">' +
                          '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9225028785900171" data-ad-slot="1234567890" data-ad-format="fluid" data-ad-layout-key="-fb+5w+4e-db+86" data-full-width-responsive="true"></ins>' +
                        '</div>';
              }
            }
            container.innerHTML = html;
            
            // Inizializza l'unita AdSense in-feed
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
          } else {
            container.innerHTML = '<div class="post-item"><a href="https://www.brunorachiele.it/p/prime-pagine-dei-giornali.html">📌 Prime Pagine dei Giornali e Rassegna Stampa</a></div>';
          }
        })
        .catch(function(err) {
          console.error('Errore durante la lettura del feed XML:', err);
          var container = document.getElementById('latest-posts');
          if (container) {
            container.innerHTML = '<div class="post-item"><a href="https://www.brunorachiele.it/p/prime-pagine-dei-giornali.html">📌 Prime Pagine dei Giornali e Rassegna Stampa</a></div>';
          }
        });
    })();
  </script>
