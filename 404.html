<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina Non Trovata - Bruno Rachiele</title>
  <meta name="robots" content="noindex, follow">

  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WV7HSX52FP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WV7HSX52FP');
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9225028785900171" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      background: #1a365d;
      color: #ffffff;
      padding: 28px 16px 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .logo-box {
      background: #ffffff;
      display: inline-block;
      padding: 6px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .logo-box img {
      display: block;
      width: 160px;
      height: auto;
    }
    .header h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .container {
      width: 90%;
      max-width: 520px;
      margin: 24px auto;
    }
    .card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      text-align: center;
      margin-bottom: 24px;
    }
    .card h2 {
      margin-top: 0;
      color: #1a365d;
      font-size: 1.25rem;
    }
    .card p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn-main {
      display: inline-block;
      width: 100%;
      background-color: #1a365d;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
      box-shadow: 0 4px 12px rgba(26, 54, 93, 0.25);
      box-sizing: border-box;
    }
    .posts-title {
      font-size: 1.1rem;
      color: #1a365d;
      margin-bottom: 12px;
      text-align: left;
      font-weight: 600;
    }
    .post-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      text-align: left;
      transition: border-color 0.2s ease;
    }
    .post-item a {
      color: #1a365d;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
    }
    .post-item a:hover {
      color: #2563eb;
    }
    .ad-box {
      width: 100%;
      margin: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-box">
      <img src="https://static.brunorachiele.it/logo.png" alt="Logo Bruno Rachiele">
    </div>
    <h1>Pagina non trovata (404)</h1>
  </header>

  <main class="container">
    <div class="card">
      <h2>Ooops! La pagina non esiste</h2>
      <p>L'indirizzo inserito non è corretto o la pagina è stata spostata. Puoi tornare alla pagina principale o consultare gli ultimi articoli.</p>

      <a href="https://www.brunorachiele.it" class="btn-main">
        🌐 Torna a BrunoRachiele.it
      </a>
    </div>

    <!-- Banner AdSense 1 (subito sotto la scheda principale) -->
    <div class="ad-box">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9225028785900171"
           data-ad-slot="1234567890"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>

    <div class="posts-title">📰 Ultimi articoli dal blog:</div>
    <div id="latest-posts">
      <p style="color: #64748b; font-size: 0.9rem;">Caricamento ultimi articoli...</p>
    </div>

    <!-- Banner AdSense 2 (in fondo alla pagina) -->
    <div class="ad-box">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9225028785900171"
           data-ad-slot="1234567890"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
  </main>

  <script>
    // Recupera in automatico gli ultimi 4 articoli dal feed di Blogger
    fetch('https://www.brunorachiele.it/feeds/posts/default?alt=json&max-results=4')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('latest-posts');
        if (data.feed && data.feed.entry && data.feed.entry.length > 0) {
          let html = '';
          data.feed.entry.forEach(entry => {
            const title = entry.title.$t;
            const alternateLink = entry.link.find(l => l.rel === 'alternate');
            if (alternateLink && alternateLink.href) {
              html += `
                <div class="post-item">
                  <a href="${alternateLink.href}">${title}</a>
                </div>
              `;
            }
          });
          container.innerHTML = html;
        } else {
          container.innerHTML = '<p style="color: #64748b;">Nessun articolo trovato.</p>';
        }
      })
      .catch(err => {
        document.getElementById('latest-posts').innerHTML = '';
      });
  </script>

</body>
</html>
