  <header class="header">

    </div>
    <h1>Pagina non trovata (404)</h1>
  </header>

  <main class="container">
    <div class="card">
      <h2>Ooops! La pagina non esiste</h2>
      <p>L'indirizzo inserito non è corretto. Torna alla home o consulta i nostri ultimi articoli.</p>

      <a href="https://www.brunorachiele.it" class="btn-main">
        🌐 Torna a BrunoRachiele.it
      </a>
    </div>

    <div class="posts-title">📰 Ultimi articoli dal blog:</div>
    
    <!-- Contenitore Articoli Dinamici + AdSense Alternati -->
    <div id="latest-posts"></div>
  </main>

  <!-- Script JSONP con Estrazione Thumbnail e Alternanza Articolo + AdSense -->
  <script>
    function renderBloggerPosts(data) {
      var container = document.getElementById('latest-posts');
      if (data && data.feed && data.feed.entry && data.feed.entry.length > 0) {
        var html = '';
        var entries = data.feed.entry;

        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          var title = entry.title.$t;
          
          // Estrazione Link Alternativo
          var linkObj = entry.link.find(function(l) { return l.rel === 'alternate'; });
          var link = linkObj ? linkObj.href : 'https://www.brunorachiele.it';

          // Estrazione Immagine Miniatura dal feed
          var thumb = 'https://static.brunorachiele.it/logo.png'; // Fallback
          if (entry.media$thumbnail && entry.media$thumbnail.url) {
            // Sostituisce la risoluzione s72 con s150 per immagini nitide
            thumb = entry.media$thumbnail.url.replace('/s72-c/', '/s150-c/');
          }

          // Blocco Articolo
          html += '<div class="post-item">' +
                    '<img src="' + thumb + '" alt="' + title + '" class="post-thumb">' +
                    '<a href="' + link + '">' + title + '</a>' +
                  '</div>';

          // Blocco Pubblicità AdSense subito dopo OGNI articolo
          html += '<div class="ad-box">' +
                    '<ins class="adsbygoogle"' +
                         ' style="display:block"' +
                         ' data-ad-client="ca-pub-9225028785900171"' +
                         ' data-ad-slot="1234567890"' +
                         ' data-ad-format="auto"' +
                         ' data-full-width-responsive="true"></ins>' +
                  '</div>';
        }

        container.innerHTML = html;

        // Inizializza tutte le unità AdSense generate dinamicamente
        try {
          var ads = container.querySelectorAll('.adsbygoogle');
          ads.forEach(function() {
            (adsbygoogle = window.adsbygoogle || []).push({});
          });
        } catch(e) {}
      }
    }
  </script>
  <!-- Richiesta Feed JSONP per 10 articoli -->
  <script src="https://www.brunorachiele.it/feeds/posts/summary?alt=json-in-script&callback=renderBloggerPosts&max-results=10"></script>

</body>
