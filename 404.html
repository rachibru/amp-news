  <!-- Script JSONP Bypassa totalmente i blocchi CORS di Safari/Chrome Mobile -->
  <script>
    function renderBloggerPosts(data) {
      var container = document.getElementById('latest-posts');
      if (data && data.feed && data.feed.entry && data.feed.entry.length > 0) {
        var html = '';
        var entries = data.feed.entry;
        for (var i = 0; i < entries.length; i++) {
          var title = entries[i].title.$t;
          var linkObj = entries[i].link.find(function(l) { return l.rel === 'alternate'; });
          if (linkObj && linkObj.href) {
            html += '<div class="post-item"><a href="' + linkObj.href + '">' + title + '</a></div>';
          }
        }
        container.innerHTML = html;
      }
    }
  </script>
  <script src="https://www.brunorachiele.it/feeds/posts/summary?alt=json-in-script&callback=renderBloggerPosts&max-results=5"></script>
