name: Generate AMP Sitemap

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Full AMP Sitemap from Blogger Feed
        run: |
          python3 -c "
          import urllib.request
          import xml.etree.ElementTree as ET

          feed_url = 'https://www.brunorachiele.it/feeds/posts/default?max-results=500'
          req = urllib.request.Request(feed_url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  xml_data = response.read()

              root = ET.fromstring(xml_data)
              ns = {'atom': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

              urls = ['https://amp.brunorachiele.it/prime-pagine-dei-giornali.html']

              for entry in root.findall('atom:entry', ns):
                  for link in entry.findall('atom:link', ns):
                      if link.attrib.get('rel') == 'alternate' and link.attrib.get('type') == 'text/html':
                          orig_url = link.attrib.get('href')
                          amp_url = orig_url.replace('https://www.brunorachiele.it/', 'https://amp.brunorachiele.it/')
                          urls.append(amp_url)

              sitemap_content = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n'
              sitemap_content += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n'
              
              for url in urls:
                  sitemap_content += f'  <url>\n    <loc>{url}</loc>\n    <changefreq>daily</changefreq>\n    <priority>0.8</priority>\n  </url>\n'
              
              sitemap_content += '</urlset>'

              with open('sitemap.xml', 'w', encoding='utf-8') as f:
                  f.write(sitemap_content)
              print('Sitemap AMP generata con successo!')

          except Exception as e:
              print(f'Errore nella generazione: {e}')
          "

      - name: Commit and Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-update full AMP sitemap.xml [skip ci]" || exit 0
          git push
