name: Generate AMP Sitemap

on:
  schedule:
    - cron: '*/5 * * * *' # Esegue ogni 5 minuti
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install BeautifulSoup4
        run: pip install beautifulsoup4

      - name: Scan HTML files and generate Sitemap XML with Canonical & Real Dates
        run: |
          python3 -c "
          import os
          import re
          import subprocess
          from datetime import datetime
          from bs4 import BeautifulSoup

          base_url = 'https://amp.brunorachiele.it/'
          ignored_files = {'404.html', 'template.html', 'story_template.html'}
          urls_data = []

          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root or 'assets' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and file not in ignored_files:
                      file_path = os.path.join(root, file)
                      rel_path = os.path.relpath(file_path, '.')
                      web_path = rel_path.replace('\\\\', '/')
                      if web_path.startswith('./'):
                          web_path = web_path[2:]

                      amp_url = base_url + web_path
                      
                      canonical_url = ''
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              soup = BeautifulSoup(f.read(), 'html.parser')
                              can_tag = soup.find('link', rel=lambda x: x and 'canonical' in x.lower())
                              if can_tag and can_tag.get('href'):
                                  canonical_url = can_tag['href']
                      except Exception:
                          pass

                      try:
                          git_date = subprocess.check_output(
                              ['git', 'log', '-1', '--format=%cd', '--date=short', file_path]
                          ).decode('utf-8').strip()
                          if not git_date:
                              git_date = datetime.now().strftime('%Y-%m-%d')
                      except Exception:
                          git_date = datetime.now().strftime('%Y-%m-%d')

                      priority = '0.8'
                      if 'stories/' in web_path:
                          priority = '0.9'

                      urls_data.append((amp_url, git_date, priority, canonical_url))

          urls_data.sort(key=lambda x: x[0])

          sitemap_content = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n'
          sitemap_content += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n'

          for url, lastmod, priority, canonical in urls_data:
              sitemap_content += '  <url>\n'
              sitemap_content += f'    <loc>{url}</loc>\n'
              sitemap_content += f'    <lastmod>{lastmod}</lastmod>\n'
              sitemap_content += '    <changefreq>daily</changefreq>\n'
              sitemap_content += f'    <priority>{priority}</priority>\n'
              sitemap_content += '  </url>\n'

          sitemap_content += '</urlset>'

          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write(sitemap_content)

          print(f'Sitemap AMP creata con successo per {len(urls_data)} URL!')
          "

      - name: Commit and Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-update sitemap with AMP & Web Stories pages [skip ci]" || exit 0
          git push
