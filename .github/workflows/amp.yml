name: Generate AMP Pages Automatically

on:
  schedule:
    # Controlla automaticamente ogni 5 minuti se ci sono nuovi post su Blogger
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permette l'avvio manuale su GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser beautifulsoup4

    - name: Run AMP Generator
      run: python generate_amp.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "Aggiornamento automatico pagine AMP [skip ci]"
        git push
