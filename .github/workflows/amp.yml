name: Auto AMP Generator

on:
  schedule:
    # Si avvia automaticamente ogni ora
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install feedparser beautifulsoup4

      - name: Run Script
        run: python generate_amp.py

      - name: Save & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico AMP" && git push)
