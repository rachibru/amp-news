name: Generate AMP Pages Automatically

on:
  schedule:
    # Controlla automaticamente ogni 3 ore se ci sono nuovi post su Blogger
    - cron: '0 */3 * * *'
  workflow_dispatch: # Ti permette di avviarlo a mano con un click se vuoi

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser beautifulsoup4

    - name: Run AMP Generator
      run: python generate_amp.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "Aggiornamento automatico pagine AMP"
        git push
